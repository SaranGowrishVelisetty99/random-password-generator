<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <button onclick="generate()">Generate Password</button>
        <p id="text">Password</p>
    </div>
    <script>
        const generate = () => {
            var passwordList = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890@#$&", password=[];
            for(var i=1;i<=6;i++){
                var randomNum = Math.floor(Math.random()*passwordList.length);
                var randomChar = passwordList.charAt(randomNum);
                //console.log(randomNum);
                password.push(randomChar);
            }

            password = password.join("");
            document.getElementById("text").innerText = `${password}`;
        }
    </script>
</body>
</html>
